<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
  <title id="title">ShopMind 购物决策与交易系统架构</title>
  <desc id="desc">React 前端连接 FastAPI。对话通过 Harness 和 LangGraph 进入只读查询或结构化推荐；独立业务 API 处理确认加购、结算、订单和模拟支付。PostgreSQL 保存业务与运行事实，Outbox worker 可选发布 RocketMQ，Redis 为可选协调后端。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17283d; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #53657b; }
      .head { font-size: 21px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; fill: #40536b; }
      .small { font-size: 15px; fill: #53657b; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="1100" rx="20" fill="#f3f6fa"/>
  <text x="50" y="58" class="title">ShopMind · 购物决策与交易系统</text>
  <text x="50" y="91" class="subtitle">当前代码架构 ｜ 模块化单体 + Web 前端 + 可选后台 worker ｜ 2026-09-14</text>

  <rect x="50" y="121" width="1340" height="74" rx="14" fill="#172e4a"/>
  <text x="720" y="152" text-anchor="middle" style="fill:#fff;font-size:21px;font-weight:700">React / TypeScript / Vite</text>
  <text x="720" y="179" text-anchor="middle" style="fill:#dbeafe;font-size:16px">对话与推荐 · 商品 / SKU 对比 · 购物车 · 结算 / 订单 / 模拟支付 · 隐私 / 运行 / 状态</text>
  <path d="M720 195 V220" class="line"/>
  <rect x="50" y="222" width="1340" height="74" rx="14" fill="#fff" stroke="#bccbdc"/>
  <text x="720" y="253" text-anchor="middle" class="head">FastAPI 接入与契约</text>
  <text x="720" y="280" text-anchor="middle" class="body">Pydantic / OpenAPI · 身份与 owner 绑定 · Correlation ID · REST + POST SSE</text>

  <path d="M378 296 V322" class="line"/>
  <path d="M1060 296 V322" class="line"/>
  <rect x="50" y="325" width="650" height="417" rx="16" fill="#ecf5ff" stroke="#aac9ea"/>
  <rect x="735" y="325" width="655" height="417" rx="16" fill="#eaf8f3" stroke="#a9d7c6"/>
  <text x="77" y="362" class="head">A · 对话与推荐</text>
  <text x="762" y="362" class="head">B · 独立业务 API 与事务服务</text>

  <rect x="77" y="382" width="596" height="62" rx="10" fill="#fff"/>
  <text x="375" y="407" text-anchor="middle" class="label">Unified Harness</text>
  <text x="375" y="431" text-anchor="middle" class="body">运行持久化 · 幂等 · 预算 · 顺序事件 · 协作式取消</text>
  <path d="M375 444 V464" class="line"/>
  <rect x="77" y="467" width="596" height="47" rx="10" fill="#d8eafe"/>
  <text x="375" y="497" text-anchor="middle" class="label">LangGraph Supervisor + Recommendation Gate</text>
  <path d="M230 514 V534" class="line"/>
  <path d="M524 514 V534" class="line"/>
  <rect x="77" y="537" width="282" height="172" rx="10" fill="#fff"/>
  <rect x="378" y="537" width="295" height="172" rx="10" fill="#fff"/>
  <text x="218" y="570" text-anchor="middle" class="label">通用只读 Agent 图</text>
  <text x="218" y="602" text-anchor="middle" class="body">Product / RAG / Preference</text>
  <text x="218" y="629" text-anchor="middle" class="body">→ Decision 汇总</text>
  <text x="218" y="659" text-anchor="middle" class="body">Tool Gateway 限权 / 审计</text>
  <text x="218" y="686" text-anchor="middle" class="small">支持按配置有界并行</text>
  <text x="525" y="570" text-anchor="middle" class="label">结构化推荐任务链</text>
  <text x="525" y="602" text-anchor="middle" class="body">Catalog → Preference → Ranking</text>
  <text x="525" y="629" text-anchor="middle" class="body">→ Evidence → Decision</text>
  <text x="525" y="659" text-anchor="middle" class="body">Schema / 硬过滤 / 确定性排序</text>
  <text x="525" y="686" text-anchor="middle" class="small">pgvector + 词法召回 + RRF</text>

  <rect x="762" y="382" width="601" height="72" rx="10" fill="#fff"/>
  <text x="1062" y="411" text-anchor="middle" class="label">PendingAction → 用户确认 → SKU Cart</text>
  <text x="1062" y="439" text-anchor="middle" class="body">明确 SKU / owner / 有效期 / 预览 / 重放</text>
  <path d="M1062 454 V474" class="line"/>
  <rect x="762" y="477" width="601" height="62" rx="10" fill="#fff"/>
  <text x="1062" y="503" text-anchor="middle" class="label">签名 Checkout → Order + Reservation</text>
  <text x="1062" y="527" text-anchor="middle" class="body">价格复核 · 幂等 · 行锁 / 条件更新 · 库存预占</text>
  <path d="M1062 539 V559" class="line"/>
  <rect x="762" y="562" width="601" height="93" rx="10" fill="#fff"/>
  <text x="1062" y="590" text-anchor="middle" class="label">Mock Payment + 持久化恢复点</text>
  <text x="1062" y="617" text-anchor="middle" class="body">claim 提交 → 事务外渠道调用 → 保存渠道结果</text>
  <text x="1062" y="642" text-anchor="middle" class="body">→ 新事务 finalize：扣减库存 / 更新状态 / Outbox</text>
  <text x="1062" y="690" text-anchor="middle" class="body">取消 / 到期释放预占 · 支付与取消通过订单锁协调</text>
  <text x="1062" y="718" text-anchor="middle" class="small">读 Agent 不直接写购物车、创建订单或支付</text>

  <path d="M375 742 V782" class="line"/>
  <path d="M1062 742 V782" class="line"/>
  <text x="720" y="770" text-anchor="middle" class="small">推荐返回候选；选中并确认后进入交易服务</text>
  <rect x="50" y="785" width="1340" height="86" rx="14" fill="#fff" stroke="#a9bbd0"/>
  <text x="720" y="821" text-anchor="middle" class="head">PostgreSQL / pgvector · 业务与运行事实</text>
  <text x="720" y="850" text-anchor="middle" class="body">Catalog / SKU 价格 / Inventory · Cart / Order / Payment · Run / Event / Memory · Documents · Outbox / Audit</text>

  <path d="M77 414 H28 V940 H48" class="optional"/>
  <path d="M1065 871 V897" class="line"/>
  <rect x="50" y="900" width="635" height="79" rx="12" fill="#fff4df" stroke="#e1c17f"/>
  <text x="367" y="931" text-anchor="middle" class="label">可选 Redis · Runtime 协调</text>
  <text x="367" y="960" text-anchor="middle" class="body">准入租约 / 限流 / 去重 / 缓存；不承载交易库存</text>
  <rect x="710" y="900" width="680" height="79" rx="12" fill="#fff4df" stroke="#e1c17f"/>
  <text x="1050" y="931" text-anchor="middle" class="label">Outbox Worker → 可选 RocketMQ Publisher</text>
  <text x="1050" y="960" text-anchor="middle" class="body">租约 / CAS / 退避 / 死信 / redrive；至少一次发布</text>

  <rect x="50" y="1006" width="1340" height="51" rx="12" fill="#e3e9f1"/>
  <text x="720" y="1038" text-anchor="middle" class="body">横向保障：owner 隔离 · 指纹审计 / 数据删除 · Health / Readiness · pytest / PostgreSQL 集成 / Vitest / Playwright</text>
  <text x="720" y="1084" text-anchor="middle" class="small">当前边界：默认进程内 Agent；结构化推荐默认串行；模拟支付；未实现 Consumer / Inbox；无线上规模收益声明</text>
</svg>
